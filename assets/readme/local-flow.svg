<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">A local AI usage ledger becomes a visual record</title>
  <desc id="desc">A JSON ledger is imported into a browser and becomes a time view, work allocation, and evidence view. Nothing leaves the device.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#4677a8"/><stop offset=".52" stop-color="#b9d7e8"/><stop offset="1" stop-color="#c53e48"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#25425b" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="260" rx="24" fill="#f8f7f3"/>
  <path d="M85 42H1115" stroke="url(#line)" stroke-width="3" opacity=".9"/>
  <g filter="url(#shadow)">
    <rect x="68" y="75" width="250" height="128" rx="20" fill="#fff" stroke="#cad9e5" stroke-width="2"/>
    <rect x="475" y="75" width="250" height="128" rx="20" fill="#fff" stroke="#cad9e5" stroke-width="2"/>
    <rect x="882" y="75" width="250" height="128" rx="20" fill="#fff" stroke="#cad9e5" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#517eaa" stroke-width="4" stroke-linecap="round">
    <path d="M107 120h38m-38 15h52m-52 15h31"/>
    <path d="M506 151c28-31 42 12 71-10s38-43 69-10 41 3 49-14"/>
    <path d="M913 150c19-17 35-34 57-19s31 4 49-11 35 2 53 13"/>
  </g>
  <path d="M367 139h55m-15-15 15 15-15 15M774 139h55m-15-15 15 15-15 15" fill="none" stroke="#7f95a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#172431">
    <text x="107" y="169" font-size="21" font-weight="700">Small ledger · 小型账本</text>
    <text x="107" y="193" font-size="15" fill="#697b8b">date · time · category · evidence</text>
    <text x="514" y="169" font-size="21" font-weight="700">Your browser · 本机浏览器</text>
    <text x="514" y="193" font-size="15" fill="#697b8b">local calculation · no account</text>
    <text x="916" y="169" font-size="21" font-weight="700">Readable record · 可读记录</text>
    <text x="916" y="193" font-size="15" fill="#697b8b">patterns · allocation · evidence</text>
  </g>
</svg>
