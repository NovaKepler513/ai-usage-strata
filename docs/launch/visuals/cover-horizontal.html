<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Usage Strata launch cover</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #f8f4ea; color: #182330; font-family: "PingFang SC", "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif; }
    .cover { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #f8f4ea url("ridge-landscape-background.png") center / cover no-repeat; }
    .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(251,248,241,.92) 0%, rgba(251,248,241,.72) 37%, rgba(251,248,241,.06) 73%); }
    .line { position: absolute; z-index: 2; top: 8.4%; left: 7%; width: 86%; height: 2px; background: linear-gradient(90deg, #477fac 0%, #cbdce8 42%, #f5c0ab 68%, #c74b56 100%); }
    .copy { position: absolute; z-index: 3; top: 22%; left: 8%; width: 47%; }
    .eyebrow { margin: 0 0 22px; color: #4679a8; font-size: 18px; font-weight: 700; letter-spacing: .17em; }
    h1 { max-width: 760px; margin: 0; font-family: Georgia, "Songti SC", serif; font-size: clamp(58px, 6.2vw, 104px); font-weight: 500; letter-spacing: -.065em; line-height: .98; }
    .sub { max-width: 560px; margin: 30px 0 0; color: #52606c; font-size: clamp(20px, 1.8vw, 30px); line-height: 1.45; letter-spacing: .01em; }
    .url { position: absolute; z-index: 3; left: 8%; bottom: 10%; color: #567083; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; letter-spacing: .035em; }
    .brand { position: absolute; z-index: 3; right: 7%; bottom: 8%; padding: 10px 12px; border-radius: 8px; background: rgba(250,247,240,.76); color: #63717d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; text-align: right; }
    .brand b { display: block; color: #2c3c49; font-size: 17px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="cover">
    <div class="line"></div>
    <section class="copy">
      <p class="eyebrow">LOCAL-FIRST AI TOOL</p>
      <h1>看见你和 AI<br>一起工作的形状</h1>
      <p class="sub">把时间、文字量、工作去向和当天证据，留成一份只属于自己的可视化账本。</p>
    </section>
    <p class="url">novakepler513.github.io/ai-usage-strata</p>
    <p class="brand"><b>AI Usage Strata</b>© 2026 Nova Kepler · 天与视界</p>
  </main>
</body>
</html>
